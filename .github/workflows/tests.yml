name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # The tests use a fake model, so no Ollama is needed here.
      # Real-model tests are marked "llm" and skipped by default.
      - name: Run tests
        run: python -m pytest

      - name: Check every file compiles
        run: python -m compileall -q agents api core schemas services scripts tests main.py
